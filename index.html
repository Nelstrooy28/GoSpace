<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoSpace — 3D Space Mission Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Orbitron:wght@600;700;900&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230284c7'/><text x='16' y='21' font-size='14' font-family='sans-serif' font-weight='bold' text-anchor='middle' fill='white'>GS</text></svg>" />
  <link rel="stylesheet" href="./styles.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="viewport-container" class="viewport-bg" data-stage="hangar"></div>
  <div id="score-popups" class="score-popups" aria-live="polite"></div>
  <div id="game-tooltip" class="game-tooltip plate" hidden></div>
  <button id="hud-restore-btn" class="hud-restore plate btn-sci" type="button" hidden>SHOW HUD [H]</button>

  <section id="title-overlay" class="title-overlay">
    <div class="title-card plate">
      <div class="title-eyebrow">NASA / CSA INTERACTIVE MISSION SIMULATOR</div>
      <h1 class="game-logo">GOSPACE</h1>
      <p class="title-sub">Architect real orbital spacecraft, launch rockets from the pad, and command live ground downlinks.</p>
      <div class="mode-switch" role="group" aria-label="Game Mode">
        <button id="mode-campaign-btn" class="btn-sci mode-btn active" type="button">PLAY CAMPAIGN</button>
        <button id="mode-sandbox-btn" class="btn-sci mode-btn" type="button">SANDBOX FREEPLAY</button>
      </div>
      <div id="contract-grid" class="contract-grid"></div>
    </div>
  </section>

  <div id="hud-layer" class="hud-layer">
    <header id="hud-top" class="hud-top plate">
      <div class="brand-cluster">
        <span class="brand-mark" aria-hidden="true">GS</span>
        <button id="active-mission-pill" class="btn-sci mission-chip" type="button" title="Switch Mission Contract">
          <span class="brand-name">GOSPACE</span>
          <span id="scenario-badge" class="badge-tag">L1</span>
        </button>
        <nav id="stage-switcher" class="stage-bar" aria-label="Mission Stages">
          <button class="stage-btn active" data-stage="hangar" type="button">1. HANGAR</button>
          <button class="stage-btn" data-stage="launch" type="button">2. PAD</button>
          <button class="stage-btn" data-stage="orbit" type="button">3. ORBIT</button>
          <button class="stage-btn" data-stage="review" type="button">4. DEBRIEF</button>
        </nav>
      </div>

      <div id="cml-xp-bar" class="cml-nodes" title="JPL Concept Maturity Level (CML 1 to CML 4)">
        <div class="node-dots" id="cml-dots">
          <span class="cnode">1</span><span class="cnode">2</span><span class="cnode">3</span><span class="cnode">4</span>
        </div>
        <span id="cml-badge" class="cml-text">CML 1 · CONCEPT</span>
      </div>

      <div class="topbar-utils">
        <button id="mute-btn" class="btn-sci icon-btn" type="button" title="Toggle Audio">🔊</button>
        <button id="toggle-hud-btn" class="btn-sci" type="button" title="Hide HUD [H]">[H]</button>
        <button id="menu-btn" class="btn-sci" type="button" aria-expanded="false">⚙️ Menu / Codex</button>
      </div>
    </header>

    <aside id="codex-menu" class="codex-menu plate" hidden>
      <label class="codex-row"><input type="checkbox" id="sandbox-toggle" /><span>Sandbox Freeplay</span></label>
      <button id="save-load-btn" class="btn-sci" type="button">💾 Save / Compare Builds</button>
      <button id="mel-toggle" class="btn-sci" type="button" aria-expanded="false">📋 Master Equipment List</button>
      <button id="resources-btn" class="btn-sci" type="button">📚 NASA / CSA Codex (7)</button>
      <button id="export-json-btn" class="btn-sci" type="button">📥 Export Mission Viz JSON</button>
      <button id="reopen-title-btn" class="btn-sci" type="button">🗺️ Mission Contracts</button>
    </aside>

    <div class="hud-mid">
      <div id="comms-banner" class="comms-banner plate">
        <span class="eng-avatar" aria-hidden="true">👩‍🚀</span>
        <span id="comms-text" class="comms-text">CHIEF ENG: Initializing telemetry...</span>
      </div>
      <section id="stage-hud" class="stage-hud"></section>
      <div id="center-action-hud" class="center-action-hud"></div>
      <div id="review-overlay" class="review-overlay" hidden></div>
      <section id="mel-drawer" class="mel-drawer plate" hidden>
        <div class="drawer-head"><strong>MASTER EQUIPMENT LIST</strong><span id="mel-summary-meta" class="badge-tag">0 items</span></div>
        <div id="mel-body" class="mel-body"></div>
      </section>
    </div>

    <footer id="hud-bottom" class="hud-bottom">
      <div id="hangar-loadout" class="hangar-loadout plate">
        <div class="loadout-nav">
          <div id="segment-tabs" class="segment-pills" role="tablist">
            <button class="seg-tab active" data-segment="user" type="button" role="tab">🎯 Objective</button>
            <button class="seg-tab" data-segment="space" type="button" role="tab">🛰️ Sat Bus &amp; Payload</button>
            <button class="seg-tab" data-segment="launch" type="button" role="tab">🚀 Rocket</button>
            <button class="seg-tab" data-segment="ground" type="button" role="tab">📡 Comms</button>
          </div>
          <div id="sub-pills" class="sub-pills"></div>
        </div>
        <div id="equipment-strip" class="equipment-strip"></div>
      </div>

      <div id="status-cta-bar" class="status-cta-bar plate">
        <div id="resource-gauges" class="gauges-mini"></div>
        <button id="launch-cta-btn" class="btn-rollout" type="button">🚀 ROLL OUT TO PAD</button>
      </div>
    </footer>
  </div>

  <dialog id="resources-modal" class="modal plate">
    <div class="modal-head"><h2>NASA &amp; CSA CODEX (7)</h2><button class="btn-sci close-modal" data-close="resources-modal" type="button">Close</button></div>
    <ul id="resources-list" class="codex-list"></ul>
  </dialog>

  <dialog id="saveload-modal" class="modal plate">
    <div class="modal-head"><h2>HANGAR POINT DESIGNS</h2><button class="btn-sci close-modal" data-close="saveload-modal" type="button">Close</button></div>
    <div class="save-form">
      <input id="design-name-input" type="text" placeholder="Callsign (e.g., WildFireSat V2)" maxlength="48" />
      <button id="save-design-btn" class="btn-sci active" type="button">Save Build</button>
    </div>
    <div id="saved-designs-list" class="codex-list"></div>
    <div id="compare-box" class="compare-box"></div>
  </dialog>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
