<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoSpace — 3D Space Mission Architect</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230284c7'/><text x='16' y='21' font-size='14' font-family='sans-serif' font-weight='bold' text-anchor='middle' fill='white'>GS</text></svg>" />
  <link rel="stylesheet" href="./styles.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="viewport-container" class="viewport-bg" data-stage="hangar"></div>

  <button id="hud-restore-btn" class="hud-restore glass" type="button" hidden>Show HUD [H]</button>

  <div id="hud-layer" class="hud-layer">
    <header class="hud-top glass">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">GS</span>
        <div>
          <h1 class="brand-title">GoSpace</h1>
          <span id="scenario-badge" class="pill">Level 1</span>
        </div>
      </div>

      <select id="scenario-select" aria-label="Select mission scenario"></select>

      <div class="cml-xp" title="JPL Concept Maturity Level (CML 1 to CML 4)">
        <div id="cml-badge" class="cml-badge cml-1">CML 1 · Concept</div>
        <div class="cml-xp-track"><div id="cml-xp-fill" class="cml-xp-fill"></div></div>
      </div>

      <nav class="stage-bar" id="stage-switcher" aria-label="Mission Stages">
        <button class="stage-btn active" data-stage="hangar" type="button">1. Hangar</button>
        <button class="stage-btn" data-stage="launch" type="button">2. Launchpad</button>
        <button class="stage-btn" data-stage="orbit" type="button">3. Orbit</button>
        <button class="stage-btn" data-stage="review" type="button">4. Debrief</button>
      </nav>

      <div class="topbar-actions">
        <label class="sandbox-toggle" title="Sandbox Mode waives budget & launcher mass caps">
          <input type="checkbox" id="sandbox-toggle" />
          <span>Sandbox</span>
        </label>
        <button id="save-load-btn" class="btn btn-secondary" type="button">Save</button>
        <button id="resources-btn" class="btn btn-secondary" type="button">NASA/CSA (7)</button>
        <button id="export-json-btn" class="btn btn-secondary" type="button">Export JSON</button>
        <button id="toggle-hud-btn" class="btn btn-secondary" type="button" title="Toggle Full View [H]">Full View [H]</button>
      </div>
    </header>

    <div class="hud-mid">
      <button id="drawer-reopen-btn" class="drawer-reopen glass btn" type="button" hidden>Hangar Builder ›</button>

      <aside id="hangar-drawer" class="hangar-drawer glass" aria-label="Spacecraft Hangar">
        <div class="drawer-head">
          <strong>Spacecraft Hangar</strong>
          <button id="drawer-toggle" class="btn btn-secondary" type="button">Collapse ‹</button>
        </div>
        <div class="segment-tabs" id="segment-tabs" role="tablist">
          <button class="seg-tab active" data-segment="user" type="button" role="tab">1. User</button>
          <button class="seg-tab" data-segment="space" type="button" role="tab">2. Space</button>
          <button class="seg-tab" data-segment="launch" type="button" role="tab">3. Launch</button>
          <button class="seg-tab" data-segment="ground" type="button" role="tab">4. Ground</button>
        </div>
        <div id="segment-content" class="segment-content"></div>
      </aside>

      <section id="stage-hud" class="stage-hud"></section>
      <div id="review-overlay" class="review-overlay" hidden></div>

      <section id="mel-drawer" class="mel-drawer glass" hidden>
        <div class="drawer-head">
          <strong>Master Equipment List (MEL)</strong>
          <span id="mel-summary-meta" class="pill">0 items</span>
        </div>
        <div class="mel-body" id="mel-body"></div>
      </section>
    </div>

    <footer class="hud-bottom glass">
      <div id="resource-gauges" class="gauges-strip"></div>
      <div class="bottom-actions">
        <button id="mel-toggle" class="btn btn-secondary" type="button" aria-expanded="false">MEL</button>
        <button id="launch-cta-btn" class="btn-launch" type="button">LAUNCH MISSION</button>
      </div>
    </footer>
  </div>

  <dialog id="resources-modal" class="modal glass">
    <div class="modal-head">
      <h2>Official NASA &amp; CSA Reference Data (7)</h2>
      <button class="btn btn-secondary close-modal" data-close="resources-modal" type="button">Close</button>
    </div>
    <p class="modal-desc">GoSpace mission rules, Keplerian propagation, CubeSat limits, and CML gates are grounded in these 7 official resources:</p>
    <ul id="resources-list" class="resources-list"></ul>
  </dialog>

  <dialog id="saveload-modal" class="modal glass">
    <div class="modal-head">
      <h2>Save, Load &amp; Compare Point Designs</h2>
      <button class="btn btn-secondary close-modal" data-close="saveload-modal" type="button">Close</button>
    </div>
    <div class="save-form">
      <input id="design-name-input" type="text" placeholder="Design name (e.g., WildFireSat Baseline)" maxlength="48" />
      <button id="save-design-btn" class="btn btn-primary" type="button">Save Current</button>
    </div>
    <div id="saved-designs-list" class="saved-list"></div>
    <div id="compare-box" class="compare-box"></div>
  </dialog>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
